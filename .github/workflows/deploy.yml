name: Deploy eaapp2.1

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eaapp-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    env:
      DEPLOY_HOST: srv2120280.hstgr.cloud
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_USER"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host production
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            Port $DEPLOY_PORT
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
          EOF

      - name: Upload tracked source and deploy
        run: |
          set -euo pipefail
          release_id="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git archive --format=tar HEAD > "$RUNNER_TEMP/source.tar"
          ssh production "mkdir -p /srv/eaapp/releases/$release_id"
          scp "$RUNNER_TEMP/source.tar" "production:/srv/eaapp/releases/$release_id/source.tar"
          ssh production "cd /srv/eaapp/releases/$release_id && tar -xf source.tar && bash deploy/release.sh"

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
